name: Build Kryx Browser
on:
  push:
    paths:
      - '.github/workflows/browser.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build Kryx Browser APK
        run: |
          mkdir kb && cd kb
          base64 -d <<'B64' | tar -xJ
          
          B64
          curl -fsSL https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts | awk '$1=="0.0.0.0" && $2!="0.0.0.0" {print $2}' | sort -u > app/src/main/assets/adhosts.txt
          echo "Blocked domains: $(wc -l < app/src/main/assets/adhosts.txt)"
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../KryxBrowser.apk
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete browser -y --cleanup-tag -R ${{ github.repository }} || true
          gh release create browser KryxBrowser.apk --latest=false -R ${{ github.repository }} -t "Kryx Browser for Android TV" -n "Install on your TV with Downloader"
