name: Build Kryx
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        run: |
          base64 -d > src.tgz <<'B64'
          
          B64
          tar -xzf src.tgz
          base64 -d <<'U64' | tar -xJ
          
          U64
          base64 -d <<'V64' | tar -xJ
          
          V64
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Kryx.apk
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag -R ${{ github.repository }} || true
          gh release create latest Kryx.apk -R ${{ github.repository }} -t "Kryx for Android TV" -n "Install on your TV with Downloader"
